mautic.email_to_theme.button="Save as theme"
mautic.email_to_theme.header="Save as theme: %name%"
mautic.email_to_theme.intro="Turn this email into an email theme for the drag-and-drop builder. New emails that use the theme start with this email's layout, styles and content."
mautic.email_to_theme.form.mode="What do you want to do?"
mautic.email_to_theme.form.mode.new="Create a new theme"
mautic.email_to_theme.form.mode.update="Update an existing theme"
mautic.email_to_theme.form.name="Theme name"
mautic.email_to_theme.form.name.tooltip="Shown in the theme picker. The theme's folder name is made from it."
mautic.email_to_theme.form.target="Theme to update"
mautic.email_to_theme.form.target.placeholder="Choose a theme"
mautic.email_to_theme.form.target.tooltip="Email themes for the drag-and-drop builder. Mautic's own themes are not listed, because a Mautic update would overwrite them."
mautic.email_to_theme.form.thumbnail="Thumbnail (optional)"
mautic.email_to_theme.form.thumbnail.tooltip="A picture of the email for the theme picker: PNG, JPEG, GIF or WebP, up to 5 MB. It is converted to PNG and scaled down to 600 pixels wide."
mautic.email_to_theme.form.save="Save theme"
mautic.email_to_theme.update_help="The theme keeps its name and folder. Its current files are saved as a zip backup first. Emails that already use the theme do not change: an email gets its own copy of the theme when it is created."
mautic.email_to_theme.thumbnail_help.new="Without a thumbnail, the theme gets a plain placeholder picture."
mautic.email_to_theme.thumbnail_help.update="Without a thumbnail, the theme keeps its current picture."
mautic.email_to_theme.what_happens="What gets saved"
mautic.email_to_theme.what_happens.content="The email's layout, styles and content, exactly as built. Tokens such as {contactfield=firstname} are kept."
mautic.email_to_theme.what_happens.images="Images are copied into the theme's assets folder, so the theme still works if the originals are removed. Images that cannot be copied keep their address and are listed afterwards."
mautic.email_to_theme.what_happens.existing="The email itself is not changed."
